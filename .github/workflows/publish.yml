name: Publish

# On every push to main: run the CI gate, then publish BOTH ports at the version
# in their own manifest — the TypeScript port to npm and the Python port to PyPI.
# Each publish is idempotent (a version already on the registry is skipped, not
# failed), so re-running a partially-failed release is safe.
#
# Auth is TOKENLESS via OIDC trusted publishing on both registries — no secrets.
# One-time config (after any repo rename, redo these):
#   npm:  npmjs.com → captcha-kraken-js → Settings → Trusted Publisher →
#         GitHub Actions: JWriter20/CaptchaKraken, workflow publish.yml
#   PyPI: pypi.org → captchakraken → Publishing → add a GitHub trusted publisher:
#         JWriter20/CaptchaKraken, workflow publish.yml
on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (CI gate)
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm (captcha-kraken-js)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC trusted publishing + provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 bundles npm
          # 11.16, so take it as-is: self-upgrading npm inside setup-node's
          # toolcache leaves a half-updated tree where `publish --provenance`
          # can't resolve sigstore.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install (skip python bootstrap)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'
      - name: Build (bundles python engine + compiles TS)
        run: npm run build
      - name: Publish (idempotent)
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "captcha-kraken-js@$VER" version >/dev/null 2>&1; then
            echo "captcha-kraken-js@$VER already published — skipping."
          else
            npm publish --access public --provenance
          fi

  publish-pypi:
    name: Publish PyPI (captchakraken)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (skips existing versions)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
