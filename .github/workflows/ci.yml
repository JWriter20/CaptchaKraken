name: CI

# Fast, hermetic checks for both ports: no GPU, no network, no model weights.
# The core guard is grid detection (the foundation of every solve) plus a
# TypeScript build check on the browser solver.
on:
  pull_request:
    branches: [main]
  # Reused by publish.yml as the pre-publish gate on main pushes.
  workflow_call:

jobs:
  python-regression:
    name: Regression gate (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install client (core deps, no GPU/serve stack) + pytest
        # `-e .` pulls the lightweight client deps (opencv, pydantic, requests, …)
        # but NOT the `serve` extra (vllm/torch), so this stays hermetic + fast.
        run: |
          python -m pip install --upgrade pip
          pip install -e . 'pytest>=7.0.0'
      - name: Hermetic no-regression suite
        # The whole suite, not a hand-picked list. The previous four-file
        # allowlist silently skipped test_solver.py, test_selected_fields.py,
        # test_checkbox_captcha.py, test_move_indicator.py and
        # test_object_detection.py — tests that existed, passed locally, and
        # gated nothing. If a test is too slow or non-hermetic for CI, mark it
        # (`@pytest.mark.skipif`) so the skip is visible in the run output
        # rather than invisible in this file.
        run: python -m pytest -q

  js-build:
    name: Solver build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install (skip python bootstrap)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'
      - name: Bundle python engine + type-check
        run: |
          node scripts/copy-python.mjs
          npx tsc --noEmit -p tsconfig.json

  mcp-build:
    name: MCP server build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm run build
      # The server is only useful if it SPEAKS MCP, and a package that compiles
      # but cannot complete a handshake would ship green. This starts the built
      # binary over stdio, initializes, and asserts tools/list comes back
      # non-empty — the same check A4 was signed off on by hand.
      #
      # No credentials involved: tools/list is answered before any sign-in, so
      # this stays hermetic like the rest of the gate.
      - name: Answers an MCP handshake
        run: node ../.github/scripts/mcp-smoke.mjs node dist/index.js
