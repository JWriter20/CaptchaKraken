name: CI

# Fast, hermetic checks for both ports: no GPU, no network, no model weights.
# The core guard is grid detection (the foundation of every solve) plus a
# TypeScript build check on the browser solver.
on:
  pull_request:
    branches: [main]
  # Reused by publish.yml as the pre-publish gate on main pushes.
  workflow_call:

jobs:
  python-grid-detection:
    name: Grid detection (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CV + test deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy 'pillow>=10.0.0' 'opencv-python-headless>=4.10.0' 'pydantic>=2.0.0' 'pytest>=7.0.0'
      - name: Hermetic grid-detection tests
        run: python -m pytest tests/test_grid_detection_ci.py -q

  js-build:
    name: Solver build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install (skip python bootstrap)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'
      - name: Bundle python engine + type-check
        run: |
          node scripts/copy-python.mjs
          npx tsc --noEmit -p tsconfig.json
