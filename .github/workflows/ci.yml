name: CI

# Fast, hermetic checks: no GPU, no network, no model weights. The core guard
# is grid detection — the foundation of every solve — plus a TypeScript build
# check on the browser solver.
#
# Runs on every PR into main. On pushes to dev/main these same checks run as
# the pre-publish gate inside publish.yml (via workflow_call) — so we don't
# also trigger on push here, which would double every run.
on:
  pull_request:
    branches: [main]
  # Reused by publish.yml as the pre-publish gate on dev/main pushes.
  workflow_call:

jobs:
  grid-detection:
    name: Grid detection (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: CaptchaKraken-cli
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CV + test deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy 'opencv-python-headless>=4.10.0' 'pydantic>=2.0.0' 'pytest>=7.0.0'

      - name: Hermetic grid-detection tests
        run: python -m pytest tests/test_grid_detection_ci.py -q

  solver-build:
    name: Solver build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # Skip the heavy postinstall python/venv setup — CI only type-checks.
      - name: Install (no python setup)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'

      - name: Type-check / build
        run: npx tsc --noEmit -p tsconfig.json
